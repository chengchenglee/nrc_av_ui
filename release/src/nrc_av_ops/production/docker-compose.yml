version: '3'
services:
  backend_service:
    build: ../nrc_av_web_api
    container_name: nrc_av_deploy_prod_backend
    environment:
      - SERVER_PORT=3000
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - CLIENT_URL=${CLIENT_URL}
    ports:
      - ${BACKEND_PORT}:3000
    restart: always

  frontend_service:
    build:
      context: ../nrc_av_web_ui
      args:
        - VITE_BASE_URL=${API_URL}
    container_name: nrc_av_deploy_prod_frontend
    ports:
      - ${FRONTEND_PORT}:80
    restart: always

  flyway_service:
    image: flyway/flyway
    container_name: nrc_av_deploy_prod_flyway
    command: -url=jdbc:postgresql://${DATABASE_HOST}/${DATABASE_NAME} -user=${DATABASE_USERNAME} -password=${DATABASE_PASSWORD} -baselineOnMigrate=true -connectRetries=60 migrate
    volumes:
      - '../nrc_av_web_api/sql:/flyway/sql'
