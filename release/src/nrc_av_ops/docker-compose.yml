version: '3'
services:
  backend-db:
    build: ./backend_db
    container_name: av_backend_db
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=nissan
    networks:
      - backend-db_net
    ports:
      - ${DB_PORT}:5432
    restart: always
  backend-service:
    build: ./nrc_av_web_api
    container_name: av_backend
    env_file:
      - ./nrc_av_web_api/.env
    depends_on:
      - backend-db
    networks:
      - backend-service_net
      - backend-db_net
    ports:
      - ${BACKEND_PORT}:3000
    restart: always
  frontend_service:
    build: ./nrc_av_web_ui
    container_name: av_frontend
    env_file:
      - ./nrc_av_web_ui/.env
    ports:
      - ${FRONTEND_PORT}:80
    restart: always
networks:
  backend-db_net:
  backend-service_net: