<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .agent-card {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            margin-bottom: 15px;
            padding: 15px;
            background: #f8f9fa;
        }
        .agent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .agent-name {
            font-weight: bold;
            font-size: 1.1em;
        }
        .agent-controls {
            display: flex;
            gap: 8px;
        }
        .subsystem-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 10px;
            margin: 3px 0;
            background: white;
            border-radius: 4px;
            border: 1px solid #e9ecef;
        }
        .subsystem-name {
            font-weight: 500;
        }
        .subsystem-info {
            font-size: 0.9em;
            color: #6c757d;
        }
        .btn-action {
            min-width: 60px;
        }
        .btn-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .status-running {
            color: #198754;
        }
        .status-stopped {
            color: #dc3545;
        }
        .no-agents {
            text-align: center;
            color: #6c757d;
            font-style: italic;
            padding: 40px;
        }
        .agent-selected {
            border-color: #0d6efd !important;
            background-color: #e7f3ff !important;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <h1 class="my-3">Remote Monitor</h1>
        
        <!-- Status Tab -->
        <div class="row">
            <div class="col-12">
                <h3>Agents Status</h3>
                <div id="agents-container">
                    <div class="no-agents">Connecting to agents...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>
    <script>
        class RemoteMonitor {
            constructor() {
                this.socket = io();
                this.agents = new Map();
                this.setupEventListeners();
            }

            setupEventListeners() {
                // Socket events
                this.socket.on('connect', () => {
                    console.log('Connected to server');
                });

                this.socket.on('disconnect', () => {
                    console.log('Disconnected from server');
                });

                this.socket.on('status_update', (data) => {
                    this.updateAgents(data.agents);
                });
            }

            updateAgents(agentsData) {
                // Update internal agents map
                const currentAgentNames = new Set();
                agentsData.forEach(agent => {
                    currentAgentNames.add(agent.name);
                    this.agents.set(agent.name, agent);
                });

                // Remove agents that are no longer present
                for (let agentName of this.agents.keys()) {
                    if (!currentAgentNames.has(agentName)) {
                        this.agents.delete(agentName);
                    }
                }

                this.renderAgents();
            }

            renderAgents() {
                const container = document.getElementById('agents-container');
                
                if (this.agents.size === 0) {
                    container.innerHTML = '<div class="no-agents">No agents connected</div>';
                    return;
                }

                let html = '';
                for (let [agentName, agent] of this.agents) {
                    html += this.renderAgentCard(agent);
                }
                container.innerHTML = html;

                // Add event listeners to newly created elements
                this.addAgentEventListeners();
            }

            renderAgentCard(agent) {
                const selectedClass = agent.selected ? 'agent-selected' : '';
                const cmdsMode = agent.cmdsMode || 'Sync';
                
                let subsystemsHtml = '';
                if (agent.subsystems && agent.subsystems.length > 0) {
                    agent.subsystems.forEach(sub => {
                        const statusClass = sub.isRunning ? 'status-running' : 'status-stopped';
                        const buttonText = sub.isRunning ? 'Stop' : 'Start';
                        const buttonClass = sub.isRunning ? 'btn-warning' : 'btn-success';
                        
                        subsystemsHtml += `
                            <div class="subsystem-item">
                                <div>
                                    <span class="subsystem-name">${sub.name}</span>
                                    <div class="subsystem-info ${statusClass}">
                                        ${sub.monitorCount} monitors • ${sub.isRunning ? 'Running' : 'Stopped'}
                                    </div>
                                </div>
                                <button class="btn btn-sm ${buttonClass} btn-action subsystem-btn" 
                                        data-agent="${agent.name}" 
                                        data-subsystem="${sub.name}">
                                    ${buttonText}
                                </button>
                            </div>
                        `;
                    });
                }

                return `
                    <div class="agent-card ${selectedClass}">
                        <div class="agent-header">
                            <span class="agent-name">${agent.name}</span>
                            <div class="agent-controls">
                                <button class="btn btn-sm btn-primary btn-action select-btn" 
                                        data-agent="${agent.name}">
                                    ${agent.selected ? 'Selected' : 'Select'}
                                </button>
                                <button class="btn btn-sm btn-secondary btn-action cmds-btn" 
                                        data-agent="${agent.name}">
                                    ${cmdsMode}
                                </button>
                            </div>
                        </div>
                        <div class="subsystems">
                            ${subsystemsHtml}
                        </div>
                    </div>
                `;
            }

            addAgentEventListeners() {
                // Select buttons
                document.querySelectorAll('.select-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const agentName = e.target.dataset.agent;
                        this.handleAgentSelect(agentName, e.target);
                    });
                });

                // Commands mode buttons
                document.querySelectorAll('.cmds-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const agentName = e.target.dataset.agent;
                        this.handleAgentSetCmds(agentName, e.target);
                    });
                });

                // Subsystem buttons
                document.querySelectorAll('.subsystem-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const agentName = e.target.dataset.agent;
                        const subsystemName = e.target.dataset.subsystem;
                        this.handleSubsystemToggle(agentName, subsystemName, e.target);
                    });
                });
            }

            handleAgentSelect(agentName, button) {
                button.disabled = true;
                this.socket.emit('agent_select', { agent: agentName }, (response) => {
                    button.disabled = false;
                    if (response && response.success) {
                        console.log(`Agent ${agentName} select: ${response.selected}`);
                    } else {
                        console.error('Agent select failed:', response?.error || 'No response');
                    }
                });
            }

            handleAgentSetCmds(agentName, button) {
                button.disabled = true;
                this.socket.emit('agent_set_cmds', { agent: agentName }, (response) => {
                    button.disabled = false;
                    if (response && response.success) {
                        console.log(`Agent ${agentName} cmdsMode: ${response.cmdsMode}`);
                    } else {
                        console.error('Agent set cmds failed:', response?.error || 'No response');
                    }
                });
            }

            handleSubsystemToggle(agentName, subsystemName, button) {
                button.disabled = true;
                this.socket.emit('subsystem_toggle', { 
                    agent: agentName, 
                    subsystem: subsystemName 
                }, (response) => {
                    button.disabled = false;
                    if (response && response.success) {
                        console.log(`Subsystem ${subsystemName} isRunning: ${response.isRunning}`);
                    } else {
                        console.error('Subsystem toggle failed:', response?.error || 'No response');
                    }
                });
            }
        }

        // Initialize the application
        document.addEventListener('DOMContentLoaded', () => {
            window.remoteMonitor = new RemoteMonitor();
        });
    </script>
</body>
</html>
