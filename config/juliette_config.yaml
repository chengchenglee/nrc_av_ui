Configuration:
  Name: Lima
  mapName: Franklin.set
  printTimeDebug: 0
  useGui: 1
  sendWm: 1
  sendSnapshots: 1
  broker: ccta_ads

Subsystem:
  CCM-CAR:
    Type: Sensor
    Description: Vehicle Network
    Trigger: Startup, StartRequest, ARDX, or PMUX
      - Source: StartRequest
    HealthTopics:
      - HealthTopic: /CAN_V_reader
        HealthName: CAN
        HealthTopicType: CANVReader
        NomWarnErrRate: 10, 6, 3
      - HealthTopic: /ME3_ObjData
        HealthName: ME3
        HealthTopicType: Mobileye3ObjectArray
        NomWarnErrRate: 10, 6, 3 
    Commands:
      - Name: CanReader
        Command: roslaunch nrc_leaf can_communication_modular.launch numChannels:=4 CanVConsumer:=true CanVConsumerCh:=3  CanAdasConsumer:=true CanAdasConsumerCh:=0 CanProPILOTTransceiver:=true CanProPILOTTransceiverCh:=2 Eyeq3Prod:=true Eyeq3ProdCh:=1 ContiRadar:=true ContiRadarCh:=1
        Type: Software
        LaunchTime: 5.0
    Diagnostic:
      LED: 0
      Retry: 3
      Timeout: 5
    Depends:
      - Launch:
        Run:

  Pose:
    Type: Sensor
    Description: Raw GPS
    Trigger:
      - Source: StartRequest
    HealthTopics:
      - HealthTopic: /gps_state
        HealthName: GPS
        HealthTopicType: GpsState
        NomWarnErrRate: 10, 6, 3
    Commands:
      - Name: GPS_Raw
        Command: roslaunch nrc_hw_svcs swiftnav_gps.launch
        Type: Software
        LaunchTime: 1.0
      - Name: SwiftNavConv
        Command: rosrun nrc_hw_svcs swiftnav_conv.py --node_name swiftnav_conv --map_shift_cfg=`rospack find nrc_hw_svcs`/scripts/cfg/demo2021_mapShift.json
        NodeName: swiftnav_conv
        Type: Software
        LaunchTime: 3.0
    Diagnostic:
      LED: 1
      Retry: 3
      Timeout: 5
    Depends:
      - Launch:
        Run:

  CCM:
    Type: Algorithm
    Description: CCM
    Trigger:
      - Source: StartRequest
    HealthTopics:
      - HealthTopic: /ccm_acc_control_h
        HealthName: CCM
        HealthTopicType: String
        NomWarnErrRate: 10, 6, 3 
      - HealthTopic: /ProPILOT_inputs
        HealthName: PPI
        HealthTopicType: ProPILOTInput
        NomWarnErrRate: 10, 6, 3
      - HealthTopic: /ccm_speed_plan
        HealthName: CSP
        HealthTopicType: String
        NomWarnErrRate: 0.1, 0.01, 0.01
    Commands:
      - Name: CCM_ACC_CAV
        Command: roslaunch ccm_cav_car ccm_cav_rl_acc_juliette.launch veh_id:=ccm_cav-juliette
        Type: Software
        LaunchTime: 3.0
    Diagnostic:
      LED: 6
      Retry: 3
      Timeout: 5
    Depends:
      - Launch: 
        Run:

