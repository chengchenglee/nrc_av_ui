Configuration:
  Name: sim
  agentType: AV4
  mapName: Franklin.set
  printTimeDebug: 0
  useGui: 1
  sendWm: 1
  imgTopic: /tower_cam_front/image_stamped/compressed
  wmTopic: /pc_processor/multi_object_tracker/tracked_object_set
  sendSnapshots: 0
  broker: emqx

Subsystem:
  Sim:
    Type: Sensor
    Description: command to start simulator
    Trigger: Startup, StartRequest, ARDX, or PMUX
      - Source: StartRequest
    HealthTopics:
      - HealthTopic: /CtrlStateFLG_10hz
        HealthName: CAR
        HealthTopicType: CtrlStateFLG
        NomWarnErrRate: 10, 7, 5
      - HealthTopic: /dynamic_global_pose_10hz
        HealthName: DGP
        HealthTopicType: DynamicPoseWithCovar
        NomWarnErrRate: 10, 8, 6
    Commands:
      - Name: Simulator
        Command: rosrun nrc_sim SimpleatorSimNode __name:=SimpleSimNode
        NodeName: SimpleSimNode
        Type: Software
        LaunchTime: 1
      - Name: DGP_Throttle
        Command: rosrun topic_tools throttle messages /dynamic_global_pose 10.0 /dynamic_global_pose_10hz
        NodeName: DGP_Throttle
        Type: Software
        LaunchTime: 1
      - Name: CSF_Throttle
        Command: rosrun topic_tools throttle messages /CtrlStateFLG 10.0 /CtrlStateFLG_10hz
        NodeName: CSF_Throttle
        Type: Software
        LaunchTime: 1
      - Name: TfSys
        Command: roslaunch nrc_svcs leaf_tf_subsystem.launch sanborn:=true
        Type: Software
        LaunchTime: 1
    Diagnostic:
      Retry: 3
      Timeout: 3
    Depends:
      - Launch:
        Run:
    
  WM:
    Type: Algorithm
    Description: World Model
    Trigger:
      - Source: StartRequest
    HealthTopics:
      - HealthTopic: /object_tracker/health
        HealthName: Fusion
        HealthTopicType: DiagnosticArray
        NomWarnErrRate: 10, 6, 3
      - HealthTopic: /traffic_light/detection/health
        HealthName: TLR
        HealthTopicType: DiagnosticArray
        NomWarnErrRate: 1, 0.6, 0.3
      - HealthTopic: /VirtualVehs/health
        HealthName: Virtual
        HealthTopicType: DiagnosticArray
        NomWarnErrRate: 10, 6, 3
      - HealthTopic: /master_filter/health
        HealthName: WOS
        HealthTopicType: DiagnosticArray
        NomWarnErrRate: 10, 6, 3
    Commands:
      - Name: WM
        Command: roslaunch nrc_wm2_svcs leaf_pred.launch
        Type: Software
        LaunchTime: 1.0
    Diagnostic:
      LED: 5
      Retry: 3
      Timeout: 5
      File:
    Depends:
      - Launch: Sim
        Run:

  Goals:
    Type: Algorithm
    Description: AutoGoals
    Trigger:
      - Source: StartRequest
    HealthTopics:
      - HealthTopic: /modia/route_plan/health
        HealthName: ROUTE
        HealthTopicType: DiagnosticArray
        NomWarnErrRate: 1, 0.5, 0.2
      - HealthTopic: /autoGoals/health
        HealthName: GOALS
        HealthTopicType: DiagnosticArray
        NomWarnErrRate: 10, 6, 3
    Commands:
      - Name: Waypoints
        Command: rosrun nrc_wm2_svcs multi_set_dest_repeater.py
        Type: Software
        LaunchTime: 3.0
      - Name: AutoGoals
        Command: roslaunch nrc_wm2_svcs leaf_route.launch inclRoutePlanner:=true
        Type: Software
        LaunchTime: 3.0
    Diagnostic:
      LED: 6
      Retry: 3
      Timeout: 5
    Depends:
      - Launch:
        Run:

  Plan:
    Type: Algorithm
    Description: Trajectory Planner/Follower
    Trigger:
      - Source: StartRequest
    HealthTopics:
      - HealthTopic: /trajectory_planner/health
        HealthName: TrajP
        HealthTopicType: DiagnosticArray
        NomWarnErrRate: 10, 6, 3
      - HealthTopic: /trajectory_follower/health
        HealthName: TrajC
        HealthTopicType: DiagnosticArray
        NomWarnErrRate: 100, 60, 10
    Commands:
      - Name: Trajectory Planner
        Command: roslaunch nrc_ralp_svcs leaf_planner.launch use_predictor:=true publish_force_control:=true vehicle_type:=LeafFS
        Type: Software
        LaunchTime: 3.0
    Diagnostic:
      LED: 7
      Retry: 3
      Timeout: 5
    Depends:
      - Launch: Goals
        Run: