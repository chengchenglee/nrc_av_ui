        NodeName: PathSelectorNode
        Type: Software
        LaunchTime: 5
      - Name: HMI_Data_Conversion
        Command: rosrun nrc_svcs hmi_data_conversion __machine:=master
        NodeName: HMIDataNode
        Type: Software
        LaunchTime: 5
      - Name: Image_Reduce_Node
        Command: rosrun nrc_svcs image_reduce __machine:=airtop01
        NodeName: ImageReduceNode
