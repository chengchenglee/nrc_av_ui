Configuration:
  Name: sim
  vehicleType: ze1-01
  agentType: AV4
  mapName: new_MM_map
  printTimeDebug: 0
  useGui: 1
  sendWm: 1
  imgTopic: /tower_cam_front/image_stamped/compressed
  wmTopic: /pc_processor/multi_object_tracker/tracked_object_set
  sendSnapshots: 0
  broker: ym0_aws

Subsystem:

  NUVO:
    Type: NUVO
    Description: command to start NUVO PC
    Trigger: Startup, StartRequest, ARDX, or PMUX
      - Source: StartRequest
    HealthTopics:
      - HealthTopic: /CtrlStateFLG_10hz
        HealthName: CAR
        HealthTopicType: CtrlStateFLG
        NomWarnErrRate: 10, 7, 5
    Commands:
      - Name: NUVO_Startup
        Command: roslaunch maas_pc remote_launch_FY25.launch
        NodeName: NUVOStartmNode
        Type: Software
        LaunchTime: 30
    Diagnostic:
      Retry: 3
      Timeout: 60
    Depends:
      - Launch:
        Run:


  Car:
    Type: Basic
    Description: Vehicle basic function startup
    Trigger: Startup, StartRequest, ARDX, or PMUX
      - Source: StartRequest
    HealthTopics:
      - HealthTopic: /CtrlStateFLG_10hz
        HealthName: CAR
        HealthTopicType: CtrlStateFLG
        NomWarnErrRate: 10, 7, 5
    Commands:
      - Name: Leaf_TF_Startup
        Command: roslaunch nrc_svcs leaf_tf_subsystem.launch
        NodeName: LeafTFNode
        Type: Software
        LaunchTime: 5
      - Name: CAN_Communication
        Command: roslaunch nrc_leaf can_communication_ym0.launch
        NodeName: CanComNode
        Type: Software
        LaunchTime: 5
      - Name: Mabx_Communication
        Command: rosrun nrc_svcs nrc_mab_com __name:=mab_com __machine:=master
        NodeName: MabComNode
        Type: Software
        LaunchTime: 5
      - Name: MField_Node
        Command: rosrun nrc_svcs nrc_mfield __name:=nrc_mfield __machine:=airtop01 _mfield_lpf_value:=0.5
        NodeName: MFieldNode
        Type: Software
        LaunchTime: 5
      - Name: TF_Updater
        Command: rosrun nrc_svcs TFUpdater.py __name:=TFUpdater
        NodeName: TFUpdaterNode
        Type: Software
        LaunchTime: 5
      - Name: PC_Compressor
        Command: rosrun nrc_pcp_svcs nrc_pc_compress __name:=nrc_pc_compress
        NodeName: PCCompressNode
        Type: Software
        LaunchTime: 5
    Diagnostic:
      Retry: 3
      Timeout: 220
    Depends:
      - Launch:
        Run:

  GPS:
    Type: GPS
    Description: GPS
    Trigger: Startup, StartRequest, ARDX, or PMUX
      - Source: StartRequest
    HealthTopics:
      - HealthTopic: /CtrlStateFLG_10hz
        HealthName: CAR
        HealthTopicType: CtrlStateFLG
        NomWarnErrRate: 10, 7, 5
    Commands:
      - Name: GPS_Startup
        Command: roslaunch nrc_hw_svcs gps.launch
        NodeName: GPSNode
        Type: Software
        LaunchTime: 10
    Diagnostic:
      Retry: 3
      Timeout: 220
    Depends:
      - Launch:
        Run:


  Perc:
    Type: Sensors
    Description: sensors
    Trigger: Startup, StartRequest, ARDX, or PMUX
      - Source: StartRequest
    HealthTopics:
      - HealthTopic: /CtrlStateFLG_10hz
        HealthName: CAR
        HealthTopicType: CtrlStateFLG
        NomWarnErrRate: 10, 7, 5
    Commands:
      - Name: Sensors_Startup
        Command: roslaunch nrc_hw_svcs sensors.launch
        NodeName: SensorsNode
        Type: Software
        LaunchTime: 15
      - Name: Perception_Startup
        Command: roslaunch nrc_perc_svcs perception_ym0.launch
        NodeName: PerceptionNode
        Type: Software
        LaunchTime: 20
    Diagnostic:
      Retry: 3
      Timeout: 220
    Depends:
      - Launch:
        Run:

  Bosch:
    Type: bosch
    Description: bosch
    Trigger: Startup, StartRequest, ARDX, or PMUX
      - Source: StartRequest
    HealthTopics:
      - HealthTopic: /CtrlStateFLG_10hz
