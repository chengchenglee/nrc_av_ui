  Monitor:
    Type: System_Monitor
    Description: System monitoring and status nodes
    Trigger: Startup, StartRequest, ARDX, or PMUX
      - Source: StartRequest
    HealthTopics:
      - HealthTopic: /CtrlStateFLG_10hz
        HealthName: CAR
        HealthTopicType: CtrlStateFLG
        NomWarnErrRate: 10, 7, 5
    Commands:
      - Name: Status_Monitor
        Command: rosrun nrc_svcs StatusMonitor_from_nodelist.py ze1
        NodeName: StatusMonitorNode
        Type: Software
        LaunchTime: 5
      - Name: Debug_Monitor
        Command: rosrun nrc_svcs Q50_DebugMonitor __name:=Q50_DebugMonitor
